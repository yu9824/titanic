# https://packaging.python.org/ja/latest/guides/writing-pyproject-toml/
[build-system]
# __init__.__version__ を動的バージョンとして使用
# requires = ["setuptools>=77.0.3"]
requires = ["setuptools>=77.0.3", "setuptools-scm[toml]>=10.2.3"]
build-backend = "setuptools.build_meta"

[project]
name = "titanic"
dynamic = ["version"]
dependencies = [
    "typing_extensions >= 4.5; python_version < '3.10'",
    "numpy",
    "pandas",
    "scikit-learn",
]
requires-python = ">= 3.9"
authors = [{ name = "yu9824" }]
maintainers = [{ name = "yu9824" }]
description = "Workspace for the Kaggle Titanic competition"
readme = { file = "README.md", content-type = "text/markdown" }
# https://spdx.org/licenses/
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = ["kaggle", "titanic"]
# https://pypi.org/classifiers/
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
] # https://pypi.org/classifiers/

[project.optional-dependencies]
test = ["pytest"]
dev = ["build"]
optional = ["colorlog", "tqdm"]
# Kaggle API クライアント (データ取得・提出に使用)
kaggle = ["kaggle"]
viz = ["matplotlib", "seaborn"]
gbdt = ["lightgbm"]
notebook = ["jupyter", "jupytext"]
docs = [
    "sphinx",
    "myst-parser",
    "myst-nb",
    "sphinx-book-theme",
    "jupyter-sphinx",
]
# gui = ["TkEasyGUI"]

[project.urls]
Homepage = "https://github.com/yu9824/titanic"
# Documentation = "https://yu9824.github.io/titanic/"
# PyPI = "https://pypi.org/project/titanic/"
Source = "https://github.com/yu9824/titanic"
Tracker = "https://github.com/yu9824/titanic/issues"
"Release Notes" = "https://github.com/yu9824/titanic/releases"
# Changelog = "https://github.com/yu9824/titanic/blob/main/CHANGELOG.md"

# [project.scripts]
# titanic = "titanic.__main__:entrypoint"

# [project.gui-scripts]
# titanic-gui = "titanic:main_gui"

[tool.setuptools]
package-dir = { "" = "src" }

# setuptools>=v69.0.0以降は、py.typed や .pyiが自動で含まれる

# __init__.__version__ を動的バージョンとして使用
# [tool.setuptools.dynamic]
# version = { attr = "titanic.__version__" }

[tool.setuptools.packages.find]
where = ["src/"]

[tool.setuptools_scm]
write_to = "src/titanic/_version.py"
